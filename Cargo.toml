[workspace]
members = [".", "tokengen-sys"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout   = "deny"
print_stderr   = "deny"
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"

[package]
name = "tokengen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "tokengen"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Forwards to `tokengen-sys/test-hooks`. Enabled only via `dev-dependencies`
# below, so it is absent from default and release builds. It exists so
# `src/zeroize.rs` can record zeroize/unlock ordering for the discriminating
# assertion in `tests/zeroize_ordering.rs`.
test-hooks = ["tokengen-sys/test-hooks"]

[dependencies]
getrandom    = "0.2"
zeroize      = "1"
tokengen-sys = { path = "tokengen-sys" }

[dev-dependencies]
tokengen-sys = { path = "tokengen-sys", features = ["test-hooks"] }
