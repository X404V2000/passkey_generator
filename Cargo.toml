[workspace]
members = [".", "tokengen-sys", "tokengen-cli"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
print_stdout   = "deny"
print_stderr   = "deny"
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"

[package]
name = "tokengen"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
# Minimum supported Rust version.
#
# This is a MEASURED value, not an aspiration. It is 1.85 because a direct dependency requires it:
# `zeroize` 1.9.0 declares `edition = "2024"` and `rust-version = "1.85"` (1.8.2 was edition 2021 /
# rust-version 1.60). The previous claim of 1.75 was false and had been since `zeroize = "1"` drifted
# forward on an unpinned caret requirement — see AM-005 and DEFECT-001 D3.
#
# If you change this, change the MSRV CI job to match, and re-derive the value by building.
rust-version = "1.85"
publish = false

[lib]
name = "tokengen"
path = "src/lib.rs"

[lints]
workspace = true

[features]
# Forwards to `tokengen-sys/test-hooks`. Enabled only via `dev-dependencies`
# below, so it is absent from default and release builds. It exists so
# `src/zeroize.rs` can record zeroize/unlock ordering for the discriminating
# assertion in `tests/zeroize_ordering.rs`.
test-hooks = ["tokengen-sys/test-hooks"]

# F3.5 §11: compiles the session guard OFF. Deliberately NOT in `default`, and it must never be
# enabled in a release build. Under this feature `capture()` returns `GuardStatus::Disabled` —
# a distinguishable status, never a silent `Present`.
#
# A compile-time feature, not an environment variable: a guard disableable by ambient configuration
# is a guard whose central guarantee is conditional (G1).
dev-mode = []

[dependencies]
getrandom    = "0.2"
zeroize      = "1"
tokengen-sys = { path = "tokengen-sys" }

[dev-dependencies]
tokengen-sys = { path = "tokengen-sys", features = ["test-hooks"] }
trybuild     = "1"
