[package]
name = "tokengen"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "tokengen"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stdout   = "deny"
print_stderr   = "deny"
unwrap_used    = "deny"
expect_used    = "deny"
panic          = "deny"

[dependencies]
getrandom = "0.2"
