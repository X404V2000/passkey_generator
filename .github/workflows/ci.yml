# TokenGen CI — cross-platform gate matrix.
#
# Design: plan/reports/CI/CI-001_design.md
# Purpose: prove the project builds and passes its gates on Linux, Windows and macOS. This is the
#   evidence base for the three-platform promise (Founder decision D-P3) and the test bar (D-P4).
#
# Two properties are load-bearing and must not be relaxed:
#   1. No gate step uses `continue-on-error`. A gate that cannot fail is a gate that reports success
#      without running — the defect class this project's own rules forbid.
#   2. The toolchain is pinned via rust-toolchain.toml (1.85.1), because the trybuild snapshots are
#      compiler-version-sensitive.
#
# What this CANNOT prove: interactive USB removal, GUI interaction, or a hostile host. Those are
# manual verification items (PROJECT_PLAN §8), never claimed as CI-verified.

name: CI

on:
  push:
  pull_request:
    # Do NOT use pull_request_target — it runs with a writable token against untrusted input.
    types: [opened, synchronize, reopened]

# Least privilege: the gate matrix only needs to read the repo.
permissions:
  contents: read

# Cancels superseded runs on the same ref — saves CI minutes, not correctness.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deny warnings globally so a warning cannot be silently tolerated.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------------------------
  # The gate matrix: build, test, lint, format, cfg-coverage and advisories on all three OSes.
  # ---------------------------------------------------------------------------------------------
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Toolchain comes from rust-toolchain.toml (pinned to 1.85.1). `rustup show` records what ran.
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # --locked everywhere: a lockfile that CI silently updates is not a reproducible build.
      - name: Build (release, locked)
        run: cargo build --release --locked

      # F4 — the CLI. Built explicitly because `cargo build --release` at the workspace root builds the
      # ROOT package only; the same trap that meant tokengen-sys's tests never ran (DEFECT-006).
      - name: Build CLI (release, locked)
        run: cargo build --release --locked -p tokengen-cli

      # BOTH packages, explicitly. `cargo test` at the workspace root selects the ROOT package only, and
      # `--workspace` did not select `tokengen-sys` under this `--features` invocation either (measured:
      # 0 tokengen-sys test binaries). Nine tests were unreachable — the whole of device.rs's real-sysfs
      # coverage — until DEFECT-006. `-p` is explicit and does not depend on resolution behaviour.
      - name: Test tokengen (release, locked, with test-hooks)
        run: cargo test --release --locked --features test-hooks -p tokengen

      - name: Test tokengen-sys (release, locked)
        run: cargo test --release --locked -p tokengen-sys

      # F4 — the CLI's tests. These run the REAL BINARY as a subprocess (Bruce's contract is about exit
      # codes, and exit codes live in main). Added because the same trap struck again: the CLI was BUILT
      # above and its six tests were never run, which is DEFECT-006 repeated one day after it was recorded.
      - name: Test tokengen-cli (release, locked)
        run: cargo test --release --locked -p tokengen-cli

      # EVERY WORKSPACE MEMBER, by name. `cargo clippy --all-targets` without `-p` lints the ROOT package
      # only, so tokengen-sys and tokengen-cli were never linted by this step — tokengen-sys was covered
      # incidentally by cfg_check.sh, and tokengen-cli was covered by nothing.
      #
      # The list is explicit rather than `--workspace` because `--workspace` interacted badly with
      # `--features` in this repository before (DEFECT-006's note above). A guard step below asserts that
      # this list covers every member, so adding a crate cannot silently leave it unlinted.
      - name: Clippy (deny warnings) — every member
        run: |
          set -e
          cargo clippy --all-targets --features test-hooks -p tokengen -- -D warnings
          cargo clippy --all-targets -p tokengen-sys -- -D warnings
          cargo clippy --all-targets -p tokengen-cli -- -D warnings

      # GUARD: every workspace member must be named in this workflow. Without it, adding a crate leaves it
      # built-but-untested and linted-by-nobody — exactly the hole that hid tokengen-sys's tests and then
      # tokengen-cli's. This step fails loudly rather than reporting green coverage that does not exist.
      - name: Every workspace member is built, tested and linted here
        shell: bash
        run: |
          set -e
          members=$(python3 -c "import re,sys; t=open('Cargo.toml').read(); m=re.search(r'members\s*=\s*\[(.*?)\]', t, re.S); print(' '.join(re.findall(r'\"([^\"]+)\"', m.group(1))))")
          wf=".github/workflows/ci.yml"
          missing=""
          for m in $members; do
            [ "$m" = "." ] && continue
            if ! grep -q -- "-p $m" "$wf"; then missing="$missing $m"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::workspace member(s) not named in any -p step:$missing"
            echo "Adding a crate without adding its build/test/clippy steps means it is silently unverified."
            exit 1
          fi
          echo "every workspace member is named in this workflow: $members"

      - name: Format check
        run: cargo fmt --check

      # F3.5 §11: `dev-mode` is a cfg path, and a cfg path that is never compiled is not covered
      # (corollary: compilation targets are coverage). It must build AND lint clean under the feature,
      # and its test must run.
      - name: dev-mode build, lint and test
        # TOKENGEN_DEV_MODE_ACK is required by a compile-time check in src/session.rs: enabling
        # dev-mode without an explicit acknowledgement fails the build, so a release build cannot
        # acquire the guard-disabling path by accident.
        env:
          TOKENGEN_DEV_MODE_ACK: "1"
        run: |
          cargo clippy --all-targets --features dev-mode -p tokengen -- -D warnings
          cargo test --release --locked --features dev-mode -p tokengen

      # F3.5 §11 requires `dev-mode` to be absent from a release build. Enforced mechanically, twice:
      #   1. here, that it is not in the `default` feature set;
      #   2. in src/session.rs, that enabling it requires an explicit build-time acknowledgement.
      # A binary that reported `Disabled` where a user expected `Present` is the false-assurance class
      # this project treats as its worst defect, so the rule is not left to trust.
      # Shell-agnostic: this runs under bash on Linux/macOS and PowerShell on Windows, so it uses a
      # single `cargo metadata | python3 -c` pipeline with NO shell `if`, no line continuation, and no
      # `exit` — the earlier version used bash syntax and failed to parse on Windows (DEFECT-005).
      #
      # The Python exits non-zero when `dev-mode` is absent from `default`, which is the desired state;
      # so the step FAILS when the exit is ZERO. That inversion is the point, and it is written as an
      # explicit comparison rather than a shell conditional so it reads the same on every runner.
      - name: dev-mode must be absent from the default feature set
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          out = subprocess.run(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"],
              capture_output=True, text=True, check=True,
          ).stdout
          default = None
          for pkg in json.loads(out)["packages"]:
              if pkg["name"] == "tokengen":
                  default = pkg["features"].get("default", [])
          if default is None:
              print("FATAL: crate `tokengen` not found in metadata; treating as failure", file=sys.stderr)
              sys.exit(1)
          if "dev-mode" in default:
              print(f"FATAL: dev-mode IS in the default feature set: {default}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: dev-mode is absent from the default feature set (default = {default})")
          PYEOF

      # The acknowledgement check must itself be shown to discriminate: enabling dev-mode WITHOUT the
      # variable must fail to compile. A guard that cannot fail is not a guard.
      # Same shell-agnostic treatment as the step above: `shell: bash` is pinned so the `if` and the
      # redirect are portable, rather than relying on the runner's default shell (PowerShell on Windows).
      - name: dev-mode without acknowledgement must FAIL to build
        shell: bash
        run: |
          if cargo build --features dev-mode >/dev/null 2>&1; then
            echo "FATAL: dev-mode built without TOKENGEN_DEV_MODE_ACK — the guard does not discriminate" >&2
            exit 1
          fi
          echo "OK: dev-mode without acknowledgement refuses to build"

      # Compiles every cfg branch (the F3 lesson: a branch no gate compiles can drift silently).
      # bash is available on all three runners, including Windows (Git Bash).
      - name: cfg-forcing compile check
        shell: bash
        run: bash scripts/cfg_check.sh

      # ---------------------------------------------------------------------------------------------
      # F3.6 — host footprint (G11/G12/G13).
      #
      # The static check asserts the ABSENCE of write APIs and runtime env reads in shipped code; the
      # dependency check asserts the SHIPPED graph matches its allow-list. Both are portable and run on
      # all three runners.
      #
      # The BEHAVIOURAL check is a test (tests/f36_footprint.rs) and runs with the normal test steps, so
      # it needs no step here. The syscall-level corroboration (strace) is NOT wired in: see F3.6 §2.3 and
      # the limitations — it is Linux-only and is deliberately absent rather than half-added.
      # ---------------------------------------------------------------------------------------------
      - name: F3.6 static footprint check (G11/G12/G13)
        shell: bash
        run: bash scripts/footprint_check.sh

      - name: F3.6 shipped-dependency check
        shell: bash
        run: bash scripts/dependency_check.sh

  # ---------------------------------------------------------------------------------------------
  # Advisories: dependency audit. Separate job so a new advisory fails loudly and independently.
  # ---------------------------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustsec/audit-check@v2` is NOT used: it always installs the latest cargo-audit, which
      # requires rustc >= 1.88, while this project pins 1.85.1 (the trybuild .stderr snapshots are
      # version-sensitive — see CI-001_design.md §4). The action offers no input to pin the tool,
      # so the incompatibility is structural, not a version-of-the-action issue.
      #
      # Instead we install a KNOWN-COMPATIBLE cargo-audit explicitly. 0.22.1 is the last release
      # supporting rustc 1.85 (cargo reports this itself when 0.22.2 is attempted). Pinned for the
      # same reason the toolchain is pinned: an unpinned security tool can change its verdict
      # without any change to this repository.
      #
      # `--locked` on the install keeps the tool's own dependency set fixed.
      - name: Install cargo-audit (pinned to the rustc-1.85-compatible release)
        run: cargo install cargo-audit --version 0.22.1 --locked

      # NOTE: this step has NEVER RUN in a green state. Until it does, the dependency audit is
      # NOT RUN — not "clean". Do not cite a passing CI run as evidence of an audit until this
      # step is observed to execute and report.
      - name: cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------------------------------
  # MSRV: the declared rust-version must actually build.
  #
  # The declared value is 1.85 (see AM-005 / DEFECT-001 D3). It was previously 1.75, which was FALSE:
  # `zeroize` 1.9.0 requires edition 2024, unsupported by Cargo 1.75, and it arrived by drift on the
  # unpinned `zeroize = "1"` caret requirement. This job exists so the declaration cannot be false
  # without CI saying so.
  #
  # This job builds ONLY — it does not run the test suite. The trybuild .stderr snapshots are
  # produced on the pinned 1.85.1 toolchain and are version-sensitive (CI-001_design.md §5).
  # ---------------------------------------------------------------------------------------------
  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85 --profile minimal

      # Builds the library only. Dev-dependencies (trybuild -> indexmap -> hashbrown) also require
      # edition 2024, so `--all-targets` would drag in the test harness; the shipped MSRV is what
      # this job asserts, and that is the library and its normal dependencies.
      - name: Build on MSRV (locked)
        run: cargo +1.85 build --locked
